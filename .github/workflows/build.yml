name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Generate Gradle Wrapper
        run: gradle wrapper
      - name: Build with Wrapper
        run: ./gradlew build
      - name: Stage Clean Jar
        run: |
          mkdir -p output
          cp build/libs/political-campaigns-1.0.0.jar output/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: political-campaigns-mod
          path: output/*.jar
