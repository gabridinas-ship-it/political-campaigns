name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build with Gradle
        run: gradle build --continue || true
      - name: Move Mod Jar
        run: |
          mkdir -p artifact-output
          cp build/libs/political-campaigns-*.jar artifact-output/
          rm -f artifact-output/*-sources.jar artifact-output/*-javadoc.jar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: artifact-output/*.jar
